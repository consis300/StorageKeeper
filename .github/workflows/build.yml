name: Build StorageKeeper

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: StorageKeeper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build StorageKeeper.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name StorageKeeper
          --icon assets/icon.ico
          --add-data "ui.html;."
          storagekeeper.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageKeeper-Windows
          path: StorageKeeper/dist/StorageKeeper.exe

      - name: Attach .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StorageKeeper/dist/StorageKeeper.exe
